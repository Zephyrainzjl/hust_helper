[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hust_helper"
version = "0.1.0"
description = "An extensible HUST campus-life helper with a searchable food guide, GUI, and multi-provider LLM tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jialiu Zeng" }]
keywords = [
  "HUST",
  "Huazhong University of Science and Technology",
  "campus-guide",
  "Wuhan-food",
  "food-search",
  "LLM",
  "Flet",
  "Android",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Education",
]
dependencies = [
  "httpx>=0.27",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
gui = ["flet>=0.28"]
llm = ["litellm>=1.70"]
secure-storage = ["keyring>=25"]
notebook = ["ipykernel>=6", "pandas>=2", "pillow>=10"]
extract = ["PyMuPDF>=1.24"]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]
all = [
  "flet>=0.28",
  "litellm>=1.70",
  "keyring>=25",
  "ipykernel>=6",
  "pandas>=2",
  "pillow>=10",
  "PyMuPDF>=1.24",
]

[project.scripts]
hust-helper = "hust_helper.cli:main"
hust-eater = "hust_helper.cli:main"

[project.entry-points."hust_helper.tools"]
hust_eater = "hust_helper.tools.hust_eater:HustEaterTool"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["hust_helper*"]

[tool.setuptools.package-data]
"hust_helper.tools.hust_eater" = [
  "data/**/*",
  "schema/*.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
